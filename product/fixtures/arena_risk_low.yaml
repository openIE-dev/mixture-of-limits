# Arena fixture — risk LUT (RISK-LOW)
version: "0.1"
product: mixture-of-limits
chore:
  id: arena.risk_low
  title: Arena risk band LOW
  scenario: arena_commit
  ask: "risk score band=RISK-LOW"
  completeness:
    id: C_risk_score
    clauses:
      - required_features_present: false
      - score_within_policy_bounds: false
      - certificate_for_publish: false
limits:
  - id: grammar
    kind: grammar
  - id: voi
    kind: voi
  - id: energy
    kind: energy
    max_estimated_j: 1.0e-3
  - id: ni_certificate
    kind: efa_certificate
  - id: satiation
    kind: completeness
cascade:
  allow_model: false
measurement:
  tier: 0
  estimated_j: always
  measured_j: only_when_meter_present
  board_synth_claimed: false
# expect: commit_lookup gold=RISK-LOW
