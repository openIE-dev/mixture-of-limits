# Arena fixture — ticket-close LUT (R-REFUND)
version: "0.1"
product: mixture-of-limits
chore:
  id: arena.ticket_refund
  title: Arena ticket close refund
  scenario: arena_commit
  ask: "ticket close resolution=R-REFUND"
  completeness:
    id: C_ticket_close
    clauses:
      - resolution_code_set: false
      - customer_ack_or_sla_elapsed: false
      - no_open_blocker: false
limits:
  - id: grammar
    kind: grammar
  - id: voi
    kind: voi
  - id: energy
    kind: energy
    max_estimated_j: 1.0e-3
  - id: ni_certificate
    kind: efa_certificate
  - id: satiation
    kind: completeness
cascade:
  allow_model: false
measurement:
  tier: 0
  estimated_j: always
  measured_j: only_when_meter_present
  board_synth_claimed: false
# expect: commit_lookup gold=R-REFUND
