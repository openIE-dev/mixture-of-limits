# Arena fixture — typed decision escalate
version: "0.1"
product: mixture-of-limits
chore:
  id: arena.typed_escalate
  title: Arena typed escalate
  scenario: arena_commit
  ask: "typed decide pick=D-ESCALATE options=[D-APPROVE,D-DENY,D-ESCALATE]"
  completeness:
    id: C_ticket_close
    clauses:
      - resolution_code_set: false
      - customer_ack_or_sla_elapsed: false
      - no_open_blocker: false
limits:
  - id: grammar
    kind: grammar
  - id: voi
    kind: voi
  - id: energy
    kind: energy
    max_estimated_j: 1.0e-3
  - id: ni_certificate
    kind: efa_certificate
  - id: satiation
    kind: completeness
cascade:
  allow_model: false
measurement:
  tier: 0
  estimated_j: always
  measured_j: only_when_meter_present
  board_synth_claimed: false
# expect: commit_lookup gold=D-ESCALATE
