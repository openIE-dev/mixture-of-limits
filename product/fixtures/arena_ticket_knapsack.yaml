# Arena fixture — tiny 0-1 knapsack route (LUT miss → Solver; model cold)
version: "0.1"
product: mixture-of-limits
chore:
  id: arena.ticket_knapsack
  title: Arena ticket knapsack solver
  scenario: arena_commit
  ask: "solve knapsack capacity=4 weights=[2,2,3] values=[5,4,3] labels=[route_howto,route_ok,route_refund]"
  completeness:
    id: C_ticket_close
    clauses:
      - resolution_code_set: false
      - customer_ack_or_sla_elapsed: false
      - no_open_blocker: false
limits:
  - id: grammar
    kind: grammar
  - id: voi
    kind: voi
  - id: energy
    kind: energy
    max_estimated_j: 1.0e-3
  - id: ni_certificate
    kind: efa_certificate
  - id: satiation
    kind: completeness
cascade:
  allow_model: false
measurement:
  tier: 0
  estimated_j: always
  measured_j: only_when_meter_present
  board_synth_claimed: false
# expect: commit_solver; estimates≠measured_j
